# Optional ChatGPT subscription route over the base composition. The saved
# agent-default-model setting, when present, still wins over this bundle value.

- id: agent-default-model
  config:
    provider: openai-codex
    model: gpt-5.6-sol

- id: web
  config:
    searchProvider: openai-codex

- insert:
    - id: llm-openai-codex
      name: dsh-codex
    # Optional terminal completion adapter. Command execution is contributed
    # by the standard facet; this row only describes its completion tree.
    - id: openai-codex-tui
      name: dsh-codex/tui
